<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebMirror Pro | Universal</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #0ea5e9; --bg: #020617; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; color: white; }
        #remote-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: contain; z-index: 1; display: none; background: #000; }
        .ui { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg); padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .id-badge { background: #0f172a; border: 1px solid var(--accent); padding: 15px; border-radius: 12px; margin: 20px 0; font-family: monospace; font-size: 1.2rem; color: var(--accent); cursor: pointer; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; box-sizing: border-box; text-align: center; }
        button { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="setup-ui" class="ui">
        <div class="card">
            <h1>WebMirror Pro</h1>
            <div class="id-badge" id="my-id" onclick="copyId()">Generating ID...</div>
            <input type="text" id="remote-id" placeholder="Enter Receiver ID">
            <button onclick="startUniversalMirror()">Connect & Stream</button>
            <p id="status" style="font-size: 0.8rem; color: #94a3b8; margin-top: 15px;">Ready</p>
        </div>
    </div>

    <video id="remote-video" autoplay playsinline></video>

    <script>
        const peer = new Peer();
        const videoEl = document.getElementById('remote-video');
        const uiEl = document.getElementById('setup-ui');
        const statusEl = document.getElementById('status');

        peer.on('open', id => document.getElementById('my-id').innerText = id);

        // RECEIVER (Laptop Window)
        peer.on('call', call => {
            call.answer();
            call.on('stream', stream => {
                uiEl.style.display = "none";
                videoEl.style.display = "block";
                videoEl.srcObject = stream;
            });
        });

        async function startUniversalMirror() {
            const targetId = document.getElementById('remote-id').value;
            if(!targetId) return alert("Enter ID");

            let stream;
            try {
                // 1. NATIVE APP LOGIC (Phone)
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    statusEl.innerText = "Requesting Native Screen Access...";
                    // Using the Screen Recorder Plugin for system-wide capture
                    const { ScreenRecorder } = Capacitor.Plugins;
                    const result = await ScreenRecorder.start(); 
                    stream = result.stream;
                } 
                // 2. WEB BROWSER LOGIC (Laptop)
                else {
                    statusEl.innerText = "Requesting Browser Screen Access...";
                    stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                }

                peer.call(targetId, stream);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        function copyId() {
            navigator.clipboard.writeText(document.getElementById('my-id').innerText);
            alert("ID Copied!");
        }
    </script>
</body>
</html>
