name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Capacitor Fresh Build
        run: |
          mkdir -p www
          cp index.html www/
          rm -rf android
          npx cap add android
          npx cap sync

      - name: Patch Android Security Manifest
        run: |
          # 1. Add foreground service permissions
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />' android/app/src/main/AndroidManifest.xml
          
          # 2. Register the Screen Recorder service
          sed -i '/<\/application>/i <service android:name="com.capgo.capacitor.screenrecorder.ScreenRecorderService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaProjection" />' android/app/src/main/AndroidManifest.xml
          
          # 3. Bump SDK to 23 (Android 6.0+)
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WebMirror-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
