name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Capacitor Fresh Build
        run: |
          mkdir -p www
          cp index.html www/
          rm -rf android
          npx cap add android
          npx cap sync

      # --- THIS IS THE CRITICAL STEP ---
      - name: Overwrite Manifest with Custom Config
        run: |
          # Move your custom Manifest into the generated Android folder
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # Ensure the SDK is bumped to 23
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WebMirror-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
