name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      
      - name: Install
        run: npm install --legacy-peer-deps

      - name: Capacitor Sync
        run: |
          mkdir -p www
          cp index.html www/
          rm -rf android
          npx cap add android
          # Ensure Browser plugin is installed before sync
          npm install @capacitor/browser --legacy-peer-deps
          npx cap sync

      - name: Patch SDK
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle
          sed -i 's/minSdkVersion 22/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: WebMirror-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
