name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor Fresh Build
        run: |
          mkdir -p www
          cp index.html www/
          # FORCE REBUILD: This ensures the new server.url is actually written
          rm -rf android
          npx cap add android
          npx cap sync

      - name: Patch SDK Version
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/g' android/variables.gradle
          sed -i 's/minSdkVersion 22/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WebMirror-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
